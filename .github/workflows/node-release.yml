name: Package and test desktop nodes

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: windows-2025
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python packaging/package.py ${{ matrix.platform }}
      - if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Expand-Archive release-dist/NeuroGrid-Node-Windows-x64.zip node-install
          $env:NEUROGRID_PYTHON = (Get-Command python).Source
          ./node-install/Install-NeuroGrid.ps1 -Headless
          ./node-install/neurogrid-agent.cmd --help
          if ($LASTEXITCODE -ne 0) { throw 'Headless CLI failed' }
          ./node-install/.venv/Scripts/python.exe -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
          if ($LASTEXITCODE -ne 0) { throw 'Headless install includes Qt' }
          ./node-install/Install-NeuroGrid.ps1
          $programs = [Environment]::GetFolderPath('Programs')
          $shortcut = (New-Object -ComObject WScript.Shell).CreateShortcut((Join-Path $programs 'NeuroGrid Node.lnk'))
          if ($shortcut.Arguments -ne '-m neurogrid_node.desktop' -or -not (Test-Path $shortcut.TargetPath)) { throw 'Start menu shortcut is invalid' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          ./node-install/.venv/Scripts/python.exe -m neurogrid_node.desktop --smoke-test
          ./node-install/.venv/Scripts/python.exe -c "from neurogrid_node.model import Partition, checkpoint, configure_cpu; configure_cpu(2); assert Partition(checkpoint(), 0).run({'tokens': [1]}, 1)['tensor']"
      - if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libdbus-1-3 libxkbcommon0
          mkdir node-install
          tar -xf release-dist/NeuroGrid-Node-Linux-x64.tar.gz -C node-install
          export NEUROGRID_PYTHON="$(command -v python)"
          export XDG_DATA_HOME="$RUNNER_TEMP/NeuroGrid User Data"
          env -u DISPLAY -u WAYLAND_DISPLAY ./node-install/install-neurogrid.sh --headless
          env -u DISPLAY -u WAYLAND_DISPLAY ./node-install/neurogrid-agent --help
          ./node-install/.venv/bin/python -c "import importlib.util; assert importlib.util.find_spec('PySide6') is None"
          ./node-install/install-neurogrid.sh
          test -f "$XDG_DATA_HOME/applications/neurogrid-node.desktop"
          grep -Fx "Exec=\"$PWD/node-install/start-neurogrid\"" "$XDG_DATA_HOME/applications/neurogrid-node.desktop"
          QT_QPA_PLATFORM=offscreen ./node-install/start-neurogrid --smoke-test
          ./node-install/.venv/bin/python -c "from neurogrid_node.model import Partition, checkpoint, configure_cpu; configure_cpu(2); assert Partition(checkpoint(), 0).run({'tokens': [1]}, 1)['tensor']"
      - uses: actions/upload-artifact@v4
        with:
          name: neurogrid-${{ matrix.platform }}
          path: release-dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: neurogrid-*
          merge-multiple: true
          path: release-dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
