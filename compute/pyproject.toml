[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "neurogrid"
version = "0.2.0b1"
description = "Reproducible cryptographic inference research for IBM Granite"
requires-python = ">=3.12,<3.13"
[project.optional-dependencies]
granite = [
  "torch==2.7.1",
  "transformers==4.57.1",
  "huggingface-hub==0.36.2",
  "safetensors==0.5.3",
  "numpy==2.5.5",
]
verify = ["ezkl==23.0.5"]
proofs = ["ezkl==23.0.5", "numpy==2.5.5", "onnx==1.20.1", "onnxruntime==1.24.4"]

[project.scripts]
neurogrid = "neurogrid.cli:main"

[tool.setuptools.packages.find]
include = ["neurogrid*"]

[tool.setuptools.package-data]
"neurogrid.models" = ["granite.json"]
"neurogrid.proofs" = ["wasi.mjs"]
